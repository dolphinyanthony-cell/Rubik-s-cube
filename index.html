<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rubik's Cube (PRO + UI)</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }

  #moves { position: absolute; top: 10px; right: 10px; }
  #colors { position: absolute; top: 10px; left: 10px; }
  #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); }

  button {
    margin: 3px;
    padding: 8px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="colors">
  <button onclick="goToFace('yellow')" style="background:white;">White</button>
  <button onclick="goToFace('white')" style="background:yellow;">Yellow</button>
  <button onclick="goToFace('green')" style="background:green;">Green</button>
  <button onclick="goToFace('blue')" style="background:blue;color:white;">Blue</button>
  <button onclick="goToFace('red')" style="background:red;">Red</button>
  <button onclick="goToFace('orange')" style="background:orange;">Orange</button>
</div>

<div id="moves">
  <button onclick="turn('R')">R</button>
  <button onclick="turn('R\'')">R'</button>
  <button onclick="turn('L')">L</button>
  <button onclick="turn('L\'')">L'</button>
  <button onclick="turn('U')">U</button>
  <button onclick="turn('U\'')">U'</button>
  <button onclick="turn('D')">D</button>
  <button onclick="turn('D\'')">D'</button>
  <br>
  <button onclick="turn('F')">F</button>
  <button onclick="turn('F\'')">F'</button>
  <button onclick="turn('B')">B</button>
  <button onclick="turn('B\'')">B'</button>
</div>

<div id="controls">
  <button onclick="resetCube()">SOLVE</button>
  <button onclick="scrambleCube()">SCRAMBLE</button>
  <button onclick="toggleDrag()">DRAG MODE</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,0,7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.7));
const light = new THREE.PointLight(0xffffff,1.2);
light.position.set(10,10,10);
scene.add(light);

let cubeGroup = new THREE.Group();
scene.add(cubeGroup);

let cubes = [];
let isTurning = false;

let dragMode = false;
let isDragging = false;
let prev = {x:0,y:0};let orientation = {
  x: new THREE.Vector3(1,0,0),
  y: new THREE.Vector3(0,1,0),
  z: new THREE.Vector3(0,0,1)
};

// BUILD
function buildCube(){
  cubeGroup.clear();
  cubes = [];

  for(let x=-1;x<=1;x++){
    for(let y=-1;y<=1;y++){
      for(let z=-1;z<=1;z++){

        const materials = [
          new THREE.MeshStandardMaterial({color:x===1?0xff0000:0x111111}),
          new THREE.MeshStandardMaterial({color:x===-1?0xff8000:0x111111}),
          new THREE.MeshStandardMaterial({color:y===1?0xffff00:0x111111}),
          new THREE.MeshStandardMaterial({color:y===-1?0xffffff:0x111111}),
          new THREE.MeshStandardMaterial({color:z===1?0x00ff00:0x111111}),
          new THREE.MeshStandardMaterial({color:z===-1?0x0000ff:0x111111})
        ];

        const cube = new THREE.Mesh(
          new THREE.BoxGeometry(0.9,0.9,0.9),
          materials
        );

        cube.position.set(x*1.05,y*1.05,z*1.05);

        cubeGroup.add(cube);
        cubes.push(cube);
      }
    }
  }
}
buildCube();

// ROTATE LAYER
function rotateLayer(axisVec, layerValue, dir){
  if(isTurning) return;
  isTurning = true;

  const group = new THREE.Group();
  cubeGroup.add(group);

  cubes.forEach(c=>{
    let proj = c.position.clone().dot(axisVec);
    if(Math.round(proj/1.05) === layerValue){
      group.add(c);
    }
  });

  let steps = 0;
  let angle = dir * Math.PI/2;

  function anim(){
    steps++;
    group.rotateOnAxis(axisVec, angle/20);

    if(steps < 20){
      requestAnimationFrame(anim);
    } else {
      group.updateMatrixWorld();

      group.children.slice().forEach(c=>{
        c.applyMatrix4(group.matrix);
        cubeGroup.add(c);
      });

      cubeGroup.remove(group);
      isTurning = false;
    }
  }

  anim();
}function turn(move){
  let dir = move.includes("'") ? 1 : -1;

  switch(move[0]){
    case "R": rotateLayer(orientation.x, 1, -dir); break;
    case "L": rotateLayer(orientation.x, -1, dir); break;
    case "U": rotateLayer(orientation.y, 1, -dir); break;
    case "D": rotateLayer(orientation.y, -1, dir); break;
    case "F": rotateLayer(orientation.z, 1, -dir); break;
    case "B": rotateLayer(orientation.z, -1, dir); break;
  }
}

// SCRAMBLE
function scrambleCube(){
  const moves=["R","R'","L","L'","U","U'","D","D'","F","F'","B","B'"];
  let i=0;

  function step(){
    if(i>=20) return;
    if(!isTurning){
      turn(moves[Math.floor(Math.random()*moves.length)]);
      i++;
    }
    setTimeout(step,30);
  }

  step();
}

// RESET
function resetCube(){
  buildCube();
}

// COLOR CAMERA
function goToFace(color){
  if(color==="white") cubeGroup.rotation.set(Math.PI/2,0,0);
  if(color==="yellow") cubeGroup.rotation.set(-Math.PI/2,0,0);
  if(color==="green") cubeGroup.rotation.set(0,0,0);
  if(color==="blue") cubeGroup.rotation.set(0,Math.PI,0);
  if(color==="red") cubeGroup.rotation.set(0,-Math.PI/2,0);
  if(color==="orange") cubeGroup.rotation.set(0,Math.PI/2,0);

  updateOrientation();
}// UPDATE ORIENTATION
function updateOrientation(){
  const m = new THREE.Matrix4().extractRotation(cubeGroup.matrix);
  orientation.x.set(1,0,0).applyMatrix4(m).round();
  orientation.y.set(0,1,0).applyMatrix4(m).round();
  orientation.z.set(0,0,1).applyMatrix4(m).round();
}

// 🔥 NEW: LOCK CLOSEST FACE WHEN DRAG MODE IS ENABLED
function lockClosestFace(){

  let view = new THREE.Vector3();
  camera.getWorldDirection(view);

  let faces = [
    {name:"front", vec:new THREE.Vector3(0,0,1)},
    {name:"back", vec:new THREE.Vector3(0,0,-1)},
    {name:"right", vec:new THREE.Vector3(1,0,0)},
    {name:"left", vec:new THREE.Vector3(-1,0,0)},
    {name:"top", vec:new THREE.Vector3(0,1,0)},
    {name:"bottom", vec:new THREE.Vector3(0,-1,0)}
  ];

  let closest = faces[0];
  let best = -Infinity;

  faces.forEach(f=>{
    let score = f.vec.dot(view);
    if(score > best){
      best = score;
      closest = f;
    }
  });

  if(closest.name==="front") cubeGroup.rotation.set(0,0,0);
  if(closest.name==="back") cubeGroup.rotation.set(0,Math.PI,0);
  if(closest.name==="right") cubeGroup.rotation.set(0,-Math.PI/2,0);
  if(closest.name==="left") cubeGroup.rotation.set(0,Math.PI/2,0);
  if(closest.name==="top") cubeGroup.rotation.set(-Math.PI/2,0,0);
  if(closest.name==="bottom") cubeGroup.rotation.set(Math.PI/2,0,0);

  updateOrientation();
}

// DRAG MODE TOGGLE (UPDATED)
function toggleDrag(){
  dragMode = !dragMode;

  if(dragMode){
    lockClosestFace();
  }
}

// MOUSE DRAG CONTROLS
document.addEventListener("mousedown",e=>{
  if(!dragMode) return;
  isDragging=true;
  prev.x=e.clientX;
  prev.y=e.clientY;
});

document.addEventListener("mouseup",()=>isDragging=false);

document.addEventListener("mousemove",e=>{
  if(!dragMode || !isDragging) return;

  cubeGroup.rotation.y += (e.clientX-prev.x)*0.01;
  cubeGroup.rotation.x += (e.clientY-prev.y)*0.01;

  updateOrientation();

  prev.x=e.clientX;
  prev.y=e.clientY;
});

// LOOP
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}
animate();

// RESIZE
window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
