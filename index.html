<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Rubik's Cube</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
  #info {
    position: absolute;
    top: 10px;
    left: 10px;
    color: white;
    font-family: Arial;
  }
</style>
</head>
<body>

<div id="info">
  Drag to rotate view<br>
  Scroll to zoom
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152/examples/js/controls/OrbitControls.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Controls (mouse rotate)
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Lighting
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(5, 5, 5);
scene.add(light);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

// Colors
const faceColors = [
  0xffffff, // white
  0xffff00, // yellow
  0x00ff00, // green
  0x0000ff, // blue
  0xff8000, // orange
  0xff0000  // red
];

// Create mini cubes
const cubes = [];
const size = 1;

for (let x = -1; x <= 1; x++) {
  for (let y = -1; y <= 1; y++) {
    for (let z = -1; z <= 1; z++) {

      const geometry = new THREE.BoxGeometry(size, size, size);

      const materials = [
        new THREE.MeshStandardMaterial({ color: faceColors[5] }), // right
        new THREE.MeshStandardMaterial({ color: faceColors[4] }), // left
        new THREE.MeshStandardMaterial({ color: faceColors[0] }), // top
        new THREE.MeshStandardMaterial({ color: faceColors[1] }), // bottom
        new THREE.MeshStandardMaterial({ color: faceColors[2] }), // front
        new THREE.MeshStandardMaterial({ color: faceColors[3] })  // back
      ];

      const cube = new THREE.Mesh(geometry, materials);

      cube.position.set(x * 1.05, y * 1.05, z * 1.05);

      scene.add(cube);
      cubes.push(cube);
    }
  }
}

// Camera position
camera.position.z = 6;

// Animate
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Resize fix
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
