<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Rubik's Cube</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(5,5,7);

const renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHTING
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const light = new THREE.PointLight(0xffffff, 1);
light.position.set(10,10,10);
scene.add(light);

// RUBIK'S COLORS
const COLORS = {
  white: 0xffffff,
  yellow: 0xffff00,
  green: 0x00ff00,
  blue: 0x0000ff,
  orange: 0xff8000,
  red: 0xff0000,
  black: 0x111111
};

// CREATE ONE MINI CUBE WITH COLORED FACES
function createCube(x, y, z) {
  const materials = [
    new THREE.MeshStandardMaterial({ color: x === 1 ? COLORS.red : COLORS.black }),     // right
    new THREE.MeshStandardMaterial({ color: x === -1 ? COLORS.orange : COLORS.black }), // left
    new THREE.MeshStandardMaterial({ color: y === 1 ? COLORS.white : COLORS.black }),   // top
    new THREE.MeshStandardMaterial({ color: y === -1 ? COLORS.yellow : COLORS.black }), // bottom
    new THREE.MeshStandardMaterial({ color: z === 1 ? COLORS.green : COLORS.black }),   // front
    new THREE.MeshStandardMaterial({ color: z === -1 ? COLORS.blue : COLORS.black })    // back
  ];

  const geometry = new THREE.BoxGeometry(0.95, 0.95, 0.95);
  const cube = new THREE.Mesh(geometry, materials);

  cube.position.set(x, y, z);
  scene.add(cube);
}

// CREATE ALL 27 PIECES
for (let x = -1; x <= 1; x++) {
  for (let y = -1; y <= 1; y++) {
    for (let z = -1; z <= 1; z++) {
      createCube(x, y, z);
    }
  }
}

// SIMPLE ROTATION (auto spin so you can see it)
function animate() {
  requestAnimationFrame(animate);

  scene.rotation.y += 0.01;
  scene.rotation.x += 0.005;

  renderer.render(scene, camera);
}
animate();

// RESIZE
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
