<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Rubik's Cube Full</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }

  #moves {
    position: absolute;
    top: 10px;
    right: 10px;
  }

  #colors {
    position: absolute;
    top: 10px;
    left: 10px;
  }

  button {
    margin: 3px;
    padding: 8px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- 🎨 COLOR SELECTOR -->
<div id="colors">
  <button onclick="goToFace('white')" style="background:white;">White</button>
  <button onclick="goToFace('yellow')" style="background:yellow;">Yellow</button>
  <button onclick="goToFace('green')" style="background:green;">Green</button>
  <button onclick="goToFace('blue')" style="background:blue; color:white;">Blue</button>
  <button onclick="goToFace('red')" style="background:red;">Red</button>
  <button onclick="goToFace('orange')" style="background:orange;">Orange</button>
</div>

<!-- 🔁 MOVE BUTTONS -->
<div id="moves">
  <button onclick="turn('R')">R</button>
  <button onclick="turn('R\'')">R'</button>
  <button onclick="turn('L')">L</button>
  <button onclick="turn('L\'')">L'</button>
  <button onclick="turn('U')">U</button>
  <button onclick="turn('U\'')">U'</button>
  <button onclick="turn('D')">D</button>
  <button onclick="turn('D\'')">D'</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0,0,7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.PointLight(0xffffff, 1.2);
light.position.set(10,10,10);
scene.add(light);

// GROUP
const cubeGroup = new THREE.Group();
scene.add(cubeGroup);

// STORE PIECES
const cubes = [];

// COLORS
const COLORS = {
  white: 0xffffff,
  yellow: 0xffff00,
  green: 0x00ff00,
  blue: 0x0000ff,
  orange: 0xff8000,
  red: 0xff0000,
  black: 0x111111
};

// CREATE MINI CUBE
function createCube(x,y,z){
  const materials = [
    new THREE.MeshStandardMaterial({ color: x===1?COLORS.red:COLORS.black }),
    new THREE.MeshStandardMaterial({ color: x===-1?COLORS.orange:COLORS.black }),
    new THREE.MeshStandardMaterial({ color: y===1?COLORS.white:COLORS.black }),
    new THREE.MeshStandardMaterial({ color: y===-1?COLORS.yellow:COLORS.black }),
    new THREE.MeshStandardMaterial({ color: z===1?COLORS.green:COLORS.black }),
    new THREE.MeshStandardMaterial({ color: z===-1?COLORS.blue:COLORS.black })
  ];

  const cube = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.9,0.9), materials);
  cube.position.set(x*1.05,y*1.05,z*1.05);

  cubeGroup.add(cube);
  cubes.push(cube);
}

// BUILD 3x3x3
for(let x=-1;x<=1;x++){
  for(let y=-1;y<=1;y++){
    for(let z=-1;z<=1;z++){
      createCube(x,y,z);
    }
  }
}

// 🎯 CAMERA TARGET ROTATION
let targetRotation = { x: 0, y: 0 };

function goToFace(color){
  if(color==="white") targetRotation = {x: Math.PI/2, y: 0};
  if(color==="yellow") targetRotation = {x: -Math.PI/2, y: 0};
  if(color==="green") targetRotation = {x: 0, y: 0};
  if(color==="blue") targetRotation = {x: 0, y: Math.PI};
  if(color==="red") targetRotation = {x: 0, y: -Math.PI/2};
  if(color==="orange") targetRotation = {x: 0, y: Math.PI/2};
}

// 🔄 ROTATE LAYERS
function rotateLayer(axis, value, dir){
  const group = new THREE.Group();
  scene.add(group);

  cubes.forEach(c=>{
    if(Math.round(c.position[axis]/1.05) === value){
      group.add(c);
    }
  });

  let angle = dir * Math.PI/2;
  let steps = 0;

  function anim(){
    steps++;
    group.rotation[axis] += angle/20;

    if(steps < 20){
      requestAnimationFrame(anim);
    } else {
      group.children.slice().forEach(c=>{
        c.applyMatrix4(group.matrix);
        cubeGroup.add(c);
      });
      scene.remove(group);
    }
  }
  anim();
}

// MOVE BUTTONS
function turn(move){
  switch(move){
    case "R": rotateLayer("x",1,-1); break;
    case "R'": rotateLayer("x",1,1); break;
    case "L": rotateLayer("x",-1,1); break;
    case "L'": rotateLayer("x",-1,-1); break;
    case "U": rotateLayer("y",1,-1); break;
    case "U'": rotateLayer("y",1,1); break;
    case "D": rotateLayer("y",-1,1); break;
    case "D'": rotateLayer("y",-1,-1); break;
  }
}

// 🎬 LOOP
function animate(){
  requestAnimationFrame(animate);

  // smooth rotate to selected face
  cubeGroup.rotation.x += (targetRotation.x - cubeGroup.rotation.x) * 0.1;
  cubeGroup.rotation.y += (targetRotation.y - cubeGroup.rotation.y) * 0.1;

  renderer.render(scene,camera);
}
animate();

// RESIZE
window.addEventListener("resize",()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>

</body>
</html>
